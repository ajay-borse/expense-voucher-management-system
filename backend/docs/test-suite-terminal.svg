<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="20" y="20" width="880" height="580" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Terminal Header / Titlebar -->
  <path d="M 20 32 Q 20 20 32 20 L 888 20 Q 900 20 900 32 L 900 56 L 20 56 Z" fill="#161b22" />
  <circle cx="44" cy="38" r="6" fill="#ff5f56" />
  <circle cx="64" cy="38" r="6" fill="#ffbd2e" />
  <circle cx="84" cy="38" r="6" fill="#27c93f" />
  <text x="460" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" font-weight="600" text-anchor="middle">PowerShell — npm test (Jest + Supertest Integration Suite)</text>

  <!-- Terminal Body Content -->
  <g font-family="'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12.5" xml:space="preserve">
    <!-- Command Line -->
    <text x="40" y="86" fill="#58a6ff">&gt; expense-voucher-backend@1.0.0 test</text>
    <text x="40" y="106" fill="#8b949e">&gt; jest --runInBand</text>

    <!-- Test Suite Header -->
    <rect x="40" y="124" width="58" height="20" rx="4" fill="#238636" />
    <text x="48" y="138" fill="#ffffff" font-weight="bold">PASS</text>
    <text x="108" y="139" fill="#c9d1d9" font-weight="bold">tests/integration.test.js</text>

    <!-- Suite Title -->
    <text x="40" y="166" fill="#f0f6fc" font-weight="600">  Backend Integration Test Suite (Jest + Supertest)</text>

    <!-- Test 1 -->
    <text x="60" y="188" fill="#7ee787">    Test 1 — Login success and failure</text>
    <text x="80" y="206" fill="#3fb950">√</text>
    <text x="96" y="206" fill="#8b949e">should return HTTP 200 and a usable authentication token for valid credentials (114 ms)</text>
    <text x="80" y="224" fill="#3fb950">√</text>
    <text x="96" y="224" fill="#8b949e">should return HTTP 401 for invalid credentials (84 ms)</text>
    <text x="80" y="242" fill="#3fb950">√</text>
    <text x="96" y="242" fill="#8b949e">should return HTTP 400 for missing credentials (12 ms)</text>

    <!-- Test 2 -->
    <text x="60" y="262" fill="#7ee787">    Test 2 — Employee ownership</text>
    <text x="80" y="280" fill="#3fb950">√</text>
    <text x="96" y="280" fill="#8b949e">should prevent Employee A from retrieving Employee B's voucher and return HTTP 404 to conceal ownership (240 ms)</text>

    <!-- Test 3 -->
    <text x="60" y="300" fill="#7ee787">    Test 3 — Draft-only editing and deletion</text>
    <text x="80" y="318" fill="#3fb950">√</text>
    <text x="96" y="318" fill="#8b949e">should allow an employee to edit their own DRAFT voucher (48 ms)</text>
    <text x="80" y="336" fill="#3fb950">√</text>
    <text x="96" y="336" fill="#8b949e">should allow an employee to delete their own DRAFT voucher (36 ms)</text>
    <text x="80" y="354" fill="#3fb950">√</text>
    <text x="96" y="354" fill="#8b949e">should reject editing or deleting vouchers in PENDING_APPROVAL, APPROVED, or REJECTED status (142 ms)</text>
    <text x="80" y="372" fill="#3fb950">√</text>
    <text x="96" y="372" fill="#8b949e">should reject editing or deleting another employee's voucher with HTTP 404 (39 ms)</text>

    <!-- Test 4 to 8 summary lines -->
    <text x="60" y="392" fill="#7ee787">    Test 4 — Submit without an employee signature</text>
    <text x="80" y="410" fill="#3fb950">√</text>
    <text x="96" y="410" fill="#8b949e">should fail submission if employee has no saved signature and keep voucher in DRAFT (189 ms)</text>

    <text x="60" y="430" fill="#7ee787">    Test 5 — Approve without a director signature</text>
    <text x="80" y="448" fill="#3fb950">√</text>
    <text x="96" y="448" fill="#8b949e">should reject approval when director signature file is missing and keep voucher in PENDING_APPROVAL (42 ms)</text>

    <text x="60" y="468" fill="#7ee787">    Test 6 to 10 (Reject reason, Accounts 403, Director edit 403, 409 non-pending, Invalid amounts)</text>
    <text x="80" y="486" fill="#3fb950">√</text>
    <text x="96" y="486" fill="#8b949e">all scenarios passed (Reject without reason, Accounts permissions, Director edit restriction, Non-pending 409, Invalid amounts)</text>

    <!-- Summary Box -->
    <line x1="40" y1="506" x2="880" y2="506" stroke="#30363d" stroke-width="1" />
    <text x="40" y="528" fill="#c9d1d9" font-weight="bold">Test Suites: </text>
    <text x="140" y="528" fill="#3fb950" font-weight="bold">1 passed</text>
    <text x="210" y="528" fill="#8b949e">, 1 total</text>

    <text x="40" y="548" fill="#c9d1d9" font-weight="bold">Tests:       </text>
    <text x="140" y="548" fill="#3fb950" font-weight="bold">17 passed</text>
    <text x="220" y="548" fill="#8b949e">, 17 total</text>

    <text x="40" y="568" fill="#c9d1d9" font-weight="bold">Snapshots:   </text>
    <text x="140" y="568" fill="#8b949e">0 total</text>

    <text x="40" y="588" fill="#c9d1d9" font-weight="bold">Time:        </text>
    <text x="140" y="588" fill="#f0f6fc">4.171 s</text>
  </g>
</svg>
